<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gharana Junction | Digital Menu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">

    <div class="brand">

      <div class="brand-logo">
        <span>G</span>
      </div>

      <div>
        <div class="brand-name">
          Gharana Junction
        </div>

        <div class="brand-tag">
          Digital Menu
        </div>
      </div>

    </div>

    <button
      class="search-icon"
      id="searchFocusBtn">
      ⌕
    </button>

  </header>


  <!-- MAIN -->
  <main class="container">

    <!-- HERO -->
    <section class="hero">

      <p class="eyebrow">
        WELCOME TO
      </p>

      <h1>
        Something delicious
        <br>
        <em>awaits.</em>
      </h1>

      <div class="search-box">

        <span>⌕</span>

        <input
          id="searchInput"
          type="search"
          placeholder="Search dishes..."
          autocomplete="off">

      </div>

    </section>


    <!-- CATEGORY TABS -->
    <nav
      id="categoryTabs"
      class="category-tabs">
    </nav>


    <!-- MENU -->
    <section
      id="menuList"
      class="menu-list">
    </section>


    <div
      id="emptyState"
      class="empty-state"
      hidden>

      No dishes found.

    </div>

  </main>


  <!-- CART BAR -->
  <div
    id="cartBar"
    class="cart-bar"
    hidden>

    <div>

      <strong id="cartCount">
        0 items
      </strong>

      <span id="cartTotal">
        ₹0
      </span>

    </div>

    <button id="viewCartBtn">
      View Cart
    </button>

  </div>


  <!-- OVERLAY -->
  <div
    id="cartOverlay"
    class="overlay"
    hidden>
  </div>


  <!-- CART DRAWER -->
  <aside
    id="cartDrawer"
    class="cart-drawer">

    <div class="drawer-header">

      <div>

        <p class="eyebrow">
          YOUR ORDER
        </p>

        <h2>
          Cart
        </h2>

      </div>

      <button
        class="close-btn"
        id="closeCart">
        ×
      </button>

    </div>


    <div
      id="cartItems"
      class="cart-items">
    </div>


    <div class="cart-footer">

      <div class="total-row">

        <span>
          Total
        </span>

        <strong id="drawerTotal">
          ₹0
        </strong>

      </div>

      <button
        class="primary-btn"
        id="placeOrderBtn">

        Place Order on WhatsApp

      </button>

    </div>

  </aside>


  <!-- NAME MODAL -->
  <div
    id="nameModal"
    class="modal"
    hidden>

    <div class="modal-card">

      <button
        class="close-btn"
        id="closeModal">
        ×
      </button>

      <p class="eyebrow">
        ONE LAST STEP
      </p>

      <h2>
        Your name
      </h2>

      <p class="muted">
        Enter your name before sending the order.
      </p>

      <input
        id="customerName"
        class="text-input"
        type="text"
        placeholder="Enter your name"
        maxlength="60">

      <button
        class="primary-btn"
        id="continueOrder">

        Continue to WhatsApp

      </button>

    </div>

  </div>


  <!-- FIREBASE + MENU -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="menu.js"></script>

</body>
</html>
