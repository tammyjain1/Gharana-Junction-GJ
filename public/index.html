<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <title>Gharana Junction | Order Online</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="site-header">

        <div class="header-inner">

            <a
                href="/menu"
                class="brand"
            >

                <div class="brand-logo">
                    GJ
                </div>

                <div class="brand-text">

                    <strong>
                        Gharana Junction
                    </strong>

                    <span>
                        Homemade with love
                    </span>

                </div>

            </a>


            <button
                id="cartButton"
                class="cart-button"
                type="button"
                aria-label="Open cart"
            >

                <span class="cart-icon">
                    🛒
                </span>

                <span>
                    Cart
                </span>

                <span
                    id="cartCount"
                    class="cart-count"
                    hidden
                >
                    0
                </span>

            </button>

        </div>

    </header>


    <!-- =========================================
         HERO
    ========================================== -->

    <main>

        <section class="hero">

            <div class="hero-content">

                <p class="hero-label">
                    WELCOME TO
                </p>

                <h1>
                    Gharana Junction
                </h1>

                <p class="hero-description">
                    Delicious homemade food,
                    freshly prepared for you.
                </p>

            </div>

        </section>


        <!-- =====================================
             SEARCH
        ====================================== -->

        <section class="search-section">

            <div class="search-box">

                <span class="search-icon">
                    🔍
                </span>

                <input
                    id="searchInput"
                    type="search"
                    placeholder="Search for dishes..."
                    autocomplete="off"
                >

            </div>

        </section>


        <!-- =====================================
             CATEGORY NAVIGATION
        ====================================== -->

        <nav
            class="category-navigation"
            aria-label="Food categories"
        >

            <div
                id="menuCategories"
                class="category-list"
            >
                <!-- Categories loaded by JavaScript -->
            </div>

        </nav>


        <!-- =====================================
             MENU
        ====================================== -->

        <section class="menu-section">

            <div class="menu-container">

                <div
                    id="menuItems"
                    class="menu-items"
                >
                    <!-- Food items loaded by JavaScript -->
                </div>

            </div>

        </section>

    </main>


    <!-- =========================================
         CART OVERLAY
    ========================================== -->

    <div
        id="cartOverlay"
        class="cart-overlay"
    ></div>


    <!-- =========================================
         CART DRAWER
    ========================================== -->

    <aside
        id="cartDrawer"
        class="cart-drawer"
        aria-label="Shopping cart"
    >

        <div class="cart-header">

            <div>

                <p class="cart-small-title">
                    YOUR ORDER
                </p>

                <h2>
                    Your Cart
                </h2>

            </div>

            <button
                id="closeCart"
                class="close-cart"
                type="button"
                aria-label="Close cart"
            >
                ×
            </button>

        </div>


        <!-- CART ITEMS -->

        <div
            id="cartItems"
            class="cart-items"
        >

            <div class="empty-cart">

                <div class="empty-cart-icon">
                    🛒
                </div>

                <h3>
                    Your cart is empty
                </h3>

                <p>
                    Add something delicious
                    from the menu.
                </p>

            </div>

        </div>


        <!-- CART FOOTER -->

        <div class="cart-footer">

            <div class="cart-total-row">

                <span>
                    Total
                </span>

                <strong id="cartTotal">
                    ₹0
                </strong>

            </div>


            <div class="customer-field">

                <label
                    for="customerName"
                >
                    Your Name
                </label>

                <input
                    id="customerName"
                    type="text"
                    placeholder="Enter your name"
                    maxlength="60"
                    autocomplete="name"
                >

            </div>


            <button
                id="placeOrder"
                class="place-order-button"
                type="button"
            >

                <span>
                    Order on WhatsApp
                </span>

                <span>
                    →
                </span>

            </button>


            <p class="checkout-note">
                Your order will open in WhatsApp
                for confirmation.
            </p>

        </div>

    </aside>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script
        src="app.js"
        defer
    ></script>

</body>
</html>
